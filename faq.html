<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Техническая поддержка — Метро New</title>
    <!-- Автоматический редирект через 5 секунд -->
    <meta http-equiv="refresh" content="5; url=https://kirill12633.github.io/Metro.New.Official/ru/contact/">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121214;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 500px;
            padding: 40px 20px;
            background: #1a1a1e;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            border: 1px solid #2d2d34;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #f5f5f7;
        }
        p {
            font-size: 16px;
            color: #a1a1aa;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background-color: #3b82f6;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #2563eb;
        }
        .timer {
            font-size: 14px;
            color: #71717a;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🚇</div>
        <h1>Страница поддержки закрыта</h1>
        <p>Эта страница больше не поддерживается. Все вопросы и обращения теперь принимаются на официальной странице обратной связи.</p>
        
        <a href="https://kirill12633.github.io/Metro.New.Official/ru/contact/" class="btn">Перейти к контактам</a>
        
        <div class="timer">Вы будете автоматически перенаправлены через <span id="countdown">5</span> сек...</div>
    </div>

    <script>
        // Скрипт визуального отсчета секунд
        let seconds = 5;
        const countdownEl = document.getElementById('countdown');
        
        const interval = setInterval(() => {
            seconds--;
            countdownEl.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(interval);
            }
        }, 1000);
    </script>
</body>
</html>
